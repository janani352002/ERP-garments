<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#4338ca" stroke-width="8" stroke-dasharray="16 8" />

  <!-- Garment T-Shirt Silhouette Outline in Center Safe Zone -->
  <path d="M192 144 C216 176 296 176 320 144 L384 176 L352 232 L312 216 L312 368 L200 368 L200 216 L160 232 L128 176 Z" 
        fill="url(#cloth)" 
        stroke="#60a5fa" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Sewing Needle & Thread Overlay -->
  <path d="M356 128 L236 348" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" />
  <circle cx="356" cy="128" r="8" fill="#ffffff" />

  <!-- Gold AR Brand Mark -->
  <text x="256" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">AR TEX</text>
  <text x="256" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#fbbf24" letter-spacing="4">STAFF &amp; ERP</text>

  <!-- Verified Badge -->
  <circle cx="360" cy="340" r="28" fill="#10b981" stroke="#ffffff" stroke-width="6" />
  <path d="M350 340 L357 347 L372 332" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
